[project]
name = "rainflow"
version = "3.3.0"
description = "Implementation of ASTM E1049-85 rainflow cycle counting algorithm"
authors = [{ name = "Piotr Janiszewski", email = "i.am.like.me@gmail.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/iamlikeme/rainflow"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"
